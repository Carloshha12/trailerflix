<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trailerflix API</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Bienvenido a <span>Trailerflix</span></h1>
      <p class="subtitle">API de catálogo de películas y series</p>

      <form id="search-form" class="search">
        <select id="search-type" aria-label="Tipo de búsqueda">
          <option value="catalogo">Todo el catálogo</option>
          <option value="titulo">Título</option>
          <option value="categoria">Categoría</option>
          <option value="reparto">Reparto</option>
        </select>
        <input id="search-input" type="text" autocomplete="off" />
        <button type="submit">Buscar</button>
      </form>
      <p id="search-status" class="status" role="status"></p>
      <div id="results" class="results"></div>

      <h2>Endpoints</h2>
      <div class="endpoints">
        <div class="endpoint">
          <span class="method">GET</span>
          <code>/catalogo</code>
          <span class="desc">Todo el catálogo</span>
        </div>
        <div class="endpoint">
          <span class="method">GET</span>
          <code>/titulo/:title</code>
          <span class="desc">Buscar por título</span>
        </div>
        <div class="endpoint">
          <span class="method">GET</span>
          <code>/categoria/:cat</code>
          <span class="desc">Filtrar por categoría</span>
        </div>
        <div class="endpoint">
          <span class="method">GET</span>
          <code>/reparto/:act</code>
          <span class="desc">Buscar por actor/actriz</span>
        </div>
        <div class="endpoint">
          <span class="method">GET</span>
          <code>/trailer/:id</code>
          <span class="desc">Trailer por ID</span>
        </div>
      </div>

      <footer>Trailerflix &middot; Node.js + Express &middot; <span id="year"></span></footer>
    </div>

    <script src="/js/main.js"></script>
  </body>
</html>
